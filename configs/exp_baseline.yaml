# Last known-good run (run_039) — kept as the diff baseline for triage.
model_name_or_path: meta-llama/Meta-Llama-3-8B
dataset: tatsu-lab/alpaca
deepspeed: ds_z3_config.json
seed: 42
output_dir: /workspace/runs/run_039
training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 1
  bf16: true
  logging_steps: 10
  save_steps: 200
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_seq_length: 2048
